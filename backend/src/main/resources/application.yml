server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/javascript,text/css,text/html,text/plain

spring:
  application:
    name: modbus-web
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/modbus-web;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: org.h2.Driver
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  h2:
    console:
      enabled: ${H2_CONSOLE:true}
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  lifecycle:
    timeout-per-shutdown-phase: 10s

logging:
  level:
    root: INFO
    com.modbusweb: INFO
    com.digitalpetri.modbus: WARN
    org.hibernate.SQL: WARN

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  excel:
    max-rows: 5000
